<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBCO TERMLINK</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="fallout.css">
</head>

<body>
  <div id="scene">
    <img id="bg-img" src="./images/background.png">
    <div class="crt-screen bg-terminal">
      <div id="start-screen">
        <div class="start-title">ROBCO INDUSTRIES</div>
        <div class="start-sub">Appuyez sur POWER pour démarrer</div>
      </div>
      <div class="glare"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="terminal-inner-ui">
        <div id="header-title">ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL</div>
        <div id="hacker-line"><span class="cursor"></span></div>

        <div id="breadcrumb">/</div>

        <div id="screen"></div>

        <div id="statusbar">
          <span id="hover-name"></span>
          <span id="integrity-bar"></span>
        </div>
      </div>
    </div>
    <button id="power-btn" style="
    position: absolute;
    left: 62.5%;
    top: 61.7%;
    width: 2%;
    height: 3.1%;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 200;">
    </button>
  </div>
  <script type="module" src="engine.js"></script>
</body>

</html>
