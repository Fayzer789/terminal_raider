<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Rétro</title>
    <link rel="stylesheet" href="screen_fallout.css">
</head>

<body>

    <div class="monitor-casing">
        <div class="screen-bezel">
            <div class="crt-screen">
                <div class="glare"></div>
                <div class="scanlines"></div>
                <div class="vignette"></div>

                <div class="terminal-content">
                    <p>ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</p>
                    <p>COPYRIGHT 2075-2077 ROBCO INDUSTRIES</p>
                    <p>-Server 4-</p>
                    <br>
                    <p>> Initialisation du système...</p>
                    <p>> Prêt !!!.</p>
                    <span class="cursor">_</span>
                </div>

            </div>
        </div>

        <div class="bottom-panel">
            <div class="screw"></div>
            <div class="vents"></div>
            <div class="screw"></div>
            <div class="power-button-container">
                <div class="power-button"></div>
                <div class="power-text">Power</div>
            </div>
        </div>
    </div>

</body>

</html>
