<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal RobCo - OS Explorer</title>

    <link rel="stylesheet" href="screen_fallout.css">

    <link rel="stylesheet" href="fallout.css" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --fo-fg: 26, 255, 128;
            /* Vert fluo Fallout */
        }

        /* On garde la classe terminal-inner-ui pour le style global du texte */
        .terminal-inner-ui {
            font-family: "Share Tech Mono", monospace;
            color: rgb(var(--fo-fg));
            width: 100%;
            height: 100%;
            overflow-y: hidden;
            padding: 30px;
            box-sizing: border-box;
            text-shadow: 0 0 5px rgba(var(--fo-fg), 0.8);
            font-size: 20px;
        }

        /* Style pour les éléments de la liste (Dossiers/Fichiers) */
        .dir-option {
            display: block;
            margin: 4px 0;
            padding: 4px 10px;
            cursor: pointer;
            white-space: pre;
            /* Pour garder les espaces multiples */
        }

        /* L'état "Sélectionné" (quand on est dessus avec les flèches) */
        .dir-option.active {
            background-color: rgb(var(--fo-fg));
            color: #000;
            text-shadow: none;
        }

        /* Le petit chevron de sélection */
        .dir-option.active::before {
            content: "> ";
            font-weight: bold;
        }

        .dir-option::before {
            content: "  ";
            /* Espace pour aligner avec le chevron */
        }

        /* Zone de lecture de fichier */
        #file-content-view {
            display: none;
            height: 100%;
            overflow-y: auto;
        }

        .file-text {
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* Animation curseur */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: rgb(var(--fo-fg));
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-stone-800 fo-selection fo-terminal fo-ui">
    <div class="monitor-casing">

        <div class="screen-bezel">
            <div class="crt-screen bg-black bg-terminal">

                <div class="glare"></div>
                <div class="scanlines z-10" style="pointer-events: none;"></div>
                <div class="vignette" style="pointer-events: none;"></div>

                <div class="terminal-content terminal-inner-ui z-20 flex flex-col relative">

                    <p class="mb-2 uppercase font-bold">ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</p>
                    <p class="mb-6 opacity-75">Type 'help' for commands. Navigation mode active.</p>

                    <div id="explorer-view" class="flex flex-col h-full">
                        <p id="current-path" class="mb-4 font-bold text-xl">root@robco:~$ /</p>

                        <div id="directory-list" class="flex flex-col"></div>
                    </div>

                    <div id="file-content-view" class="flex-col h-full">
                        <p id="reading-path" class="mb-4 font-bold opacity-75">Reading file...</p>
                        <div id="file-text" class="file-text mb-4"></div>
                        <p class="mt-auto pt-4 border-t border-green-500 opacity-75">Press [BACKSPACE] or [ESC] to
                            return.</p>
                    </div>

                </div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="screw"></div>
            <div class="vents"></div>
            <div class="screw"></div>
            <div class="power-button-container">
                <button id="power-btn" class="power-button"></button>
                <div class="power-text">Power</div>
            </div>
        </div>
    </div>

    <script>
        // 1. DÉFINITION DE L'ARBORESCENCE DU SYSTÈME (Comme Linux)
        // type: "dir" = Dossier | type: "file" = Fichier texte
        const fileSystem = {
            "bin": {
                type: "dir",
                content: {
                    "init.exe": { type: "file", content: "SYSERR: Executable corrupted.\nRun diagnostics." },
                    "hack.sh": { type: "file", content: "#!/bin/bash\n# RobCo Bypass Protocol v1.2\n\necho 'Bypassing security...'\nsleep 2\necho 'Access Granted.'" }
                }
            },
            "etc": {
                type: "dir",
                content: {
                    "passwd": { type: "file", content: "root:x:0:0:root:/root:/bin/bash\noverseer:x:1000:1000:Overseer,,,:/home/overseer:/bin/bash\nraider:x:1001:1001:,,,:/home/raider:/bin/false" },
                    "motd": { type: "file", content: "Welcome to Vault-Tec Operations.\n\nRemember: Loose lips sink Vaults." }
                }
            },
            "home": {
                type: "dir",
                content: {
                    "overseer": {
                        type: "dir",
                        content: {
                            "journal_01.log": { type: "file", content: "Oct 23, 2077.\nThe bombs fell today. We sealed the door. God help us all." },
                            "project_safehouse.txt": { type: "file", content: "CLASSIFIED EYES ONLY.\nThe true purpose of this vault is..." }
                        }
                    },
                    "guest": {
                        type: "dir",
                        content: {
                            "readme.txt": { type: "file", content: "Welcome guest. You have limited privileges." }
                        }
                    }
                }
            }
        };

        // 2. VARIABLES D'ÉTAT
        let pathStack = [{ name: "/", dir: fileSystem }]; // Historique de navigation
        let currentOptions = []; // Les éléments affichés à l'écran
        let selectedIndex = 0; // Ce qui est survolé
        let inViewMode = false; // Savoir si on lit un fichier ou si on navigue

        const directoryList = document.getElementById('directory-list');
        const currentPathDisplay = document.getElementById('current-path');
        const explorerView = document.getElementById('explorer-view');
        const fileContentView = document.getElementById('file-content-view');
        const fileTextDisplay = document.getElementById('file-text');
        const readingPathDisplay = document.getElementById('reading-path');

        // 3. FONCTION POUR AFFICHER LE DOSSIER ACTUEL
        function renderDirectory() {
            // Construire l'affichage du chemin
            let pathString = pathStack.map(p => p.name).join("");
            if (pathString.length > 1 && pathString.startsWith("//")) {
                pathString = pathString.substring(1); // Nettoyer le double slash du root
            }
            currentPathDisplay.innerHTML = `root@robco:~$ ${pathString}<span class="cursor"></span>`;

            // Récupérer le contenu du dossier actuel
            const currentDir = pathStack[pathStack.length - 1].dir;
            directoryList.innerHTML = '';
            currentOptions = [];

            // Si on n'est pas à la racine (root), on ajoute l'option pour remonter ".."
            if (pathStack.length > 1) {
                currentOptions.push({ name: "..", type: "up" });
            }

            // Ajouter les dossiers et fichiers
            for (const [key, value] of Object.entries(currentDir)) {
                currentOptions.push({
                    name: key,
                    type: value.type,
                    content: value.content
                });
            }

            // Créer le HTML pour chaque ligne
            currentOptions.forEach((opt, index) => {
                const div = document.createElement('div');
                div.classList.add('dir-option');

                // Formater le préfixe selon si c'est un dossier ou un fichier
                let prefix = "";
                if (opt.type === "dir") prefix = "[DIR]  ";
                else if (opt.type === "file") prefix = "       ";
                else if (opt.type === "up") prefix = "[UP]   ";

                div.innerText = prefix + opt.name;
                directoryList.appendChild(div);
            });

            selectedIndex = 0;
            updateSelection();
        }

        // 4. METTRE À JOUR LE CURSEUR VISUEL
        function updateSelection() {
            if (inViewMode) return;
            const options = document.querySelectorAll('.dir-option');
            options.forEach((opt, index) => {
                if (index === selectedIndex) {
                    opt.classList.add('active');
                } else {
                    opt.classList.remove('active');
                }
            });
        }

        // 5. OUVRIR UN FICHIER
        function openFile(fileName, fileContent) {
            inViewMode = true;
            explorerView.style.display = 'none';
            fileContentView.style.display = 'flex';

            readingPathDisplay.innerText = `Reading: ${fileName}`;

            // Effet d'écriture machine à écrire très rapide pour le fichier
            fileTextDisplay.innerText = "";
            let i = 0;
            const typeWriter = setInterval(() => {
                fileTextDisplay.innerText += fileContent.charAt(i);
                i++;
                if (i >= fileContent.length) clearInterval(typeWriter);
            }, 10); // 10ms par lettre
        }

        // 6. FERMER UN FICHIER
        function closeFile() {
            inViewMode = false;
            fileContentView.style.display = 'none';
            explorerView.style.display = 'flex';
            fileTextDisplay.innerText = "";
        }

        // 7. GESTION DES TOUCHES CLAVIER
        document.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "Enter", "Backspace", "Escape"].indexOf(e.code) > -1) {
                e.preventDefault(); // Empêche le scroll de la page
            }

            // Si on est en train de lire un fichier
            if (inViewMode) {
                if (e.key === 'Backspace' || e.key === 'Escape') {
                    closeFile();
                }
                return;
            }

            // Si on navigue dans les dossiers
            if (e.key === 'ArrowDown') {
                selectedIndex = (selectedIndex + 1) % currentOptions.length;
                updateSelection();
            }
            else if (e.key === 'ArrowUp') {
                selectedIndex = (selectedIndex - 1 + currentOptions.length) % currentOptions.length;
                updateSelection();
            }
            else if (e.key === 'Enter') {
                const selected = currentOptions[selectedIndex];

                // Petit clignotement de validation
                const options = document.querySelectorAll('.dir-option');
                options[selectedIndex].style.backgroundColor = "white";

                setTimeout(() => {
                    if (selected.type === "dir") {
                        // Entrer dans le dossier
                        pathStack.push({ name: selected.name + "/", dir: selected.content });
                        renderDirectory();
                    }
                    else if (selected.type === "up") {
                        // Remonter d'un niveau
                        pathStack.pop();
                        renderDirectory();
                    }
                    else if (selected.type === "file") {
                        // Lire le fichier
                        openFile(selected.name, selected.content);
                    }
                }, 100);
            }
        });

        // 8. Gestion du bouton d'alimentation (pour le collègue)
        const powerBtn = document.getElementById('power-btn');
        powerBtn.addEventListener('click', () => {
            console.log("Action: Bouton Power cliqué.");
            document.dispatchEvent(new CustomEvent('powerButtonPressed', {
                detail: { state: 'toggled' }
            }));
        });

        // Initialisation au lancement
        renderDirectory();

    </script>
</body>

</html>
