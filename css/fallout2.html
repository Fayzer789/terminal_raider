<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal RobCo - OS Explorer</title>

    <link rel="stylesheet" href="screen_fallout.css">

    <link rel="stylesheet" href="fallout.css" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body class="bg-stone-800 fo-selection fo-terminal fo-ui">
    <div class="monitor-casing">

        <div class="screen-bezel">
            <div class="crt-screen bg-black bg-terminal">

                <div class="glare"></div>
                <div class="scanlines z-10" style="pointer-events: none;"></div>
                <div class="vignette" style="pointer-events: none;"></div>

                <div class="terminal-content terminal-inner-ui z-20 flex flex-col relative">

                    <p class="mb-2 uppercase font-bold">ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</p>

                    <div id="explorer-view" class="flex flex-col h-full">
                        <p id="current-path" class="mb-4 font-bold text-xl">root@robco:~$ /</p>
                        <div id="directory-list" class="flex flex-col"></div>
                    </div>

                    <div id="file-content-view" class="flex-col h-full">
                        <p id="reading-path" class="mb-4 font-bold opacity-75">Reading file...</p>
                        <div id="file-text" class="file-text mb-4"></div>
                        <p class="mt-auto pt-4 border-t border-green-500 opacity-75">Press [BACKSPACE] or [ESC] to
                            return.</p>
                    </div>

                </div>

            </div>
        </div>

        <div class="bottom-panel">
            <div class="screw"></div>
            <div class="vents"></div>
            <div class="screw"></div>
            <div class="power-button-container">
                <button id="power-btn" class="power-button"></button>
                <div class="power-text">Power</div>
            </div>
        </div>
    </div>

    <script>
        // 1. ARBORESCENCE DU SYSTÈME
        const fileSystem = {
            "bin": {
                type: "dir",
                content: {
                    "init.exe": { type: "file", content: "SYSERR: Executable corrupted.\nRun diagnostics." },
                    "hack.sh": { type: "file", content: "#!/bin/bash\n# RobCo Bypass Protocol v1.2\n\necho 'Bypassing security...'\nsleep 2\necho 'Access Granted.'" }
                }
            },
            "etc": {
                type: "dir",
                content: {
                    "passwd": { type: "file", content: "root:x:0:0:root:/root:/bin/bash\noverseer:x:1000:1000:Overseer,,,:/home/overseer:/bin/bash\nraider:x:1001:1001:,,,:/home/raider:/bin/false" },
                    "motd": { type: "file", content: "Welcome to Vault-Tec Operations.\n\nRemember: Loose lips sink Vaults." }
                }
            },
            "home": {
                type: "dir",
                content: {
                    "overseer": {
                        type: "dir",
                        content: {
                            "journal_01.log": { type: "file", content: "Oct 23, 2077.\nThe bombs fell today. We sealed the door. God help us all." },
                            "project_safehouse.txt": { type: "file", content: "CLASSIFIED EYES ONLY.\nThe true purpose of this vault is..." }
                        }
                    },
                    "guest": {
                        type: "dir",
                        content: {
                            "readme.txt": { type: "file", content: "Welcome guest. You have limited privileges." }
                        }
                    }
                }
            }
        };

        // 2. VARIABLES D'ÉTAT
        let pathStack = [{ name: "/", dir: fileSystem }];
        let currentOptions = [];
        let selectedIndex = 0;
        let inViewMode = false;

        const directoryList = document.getElementById('directory-list');
        const currentPathDisplay = document.getElementById('current-path');
        const explorerView = document.getElementById('explorer-view');
        const fileContentView = document.getElementById('file-content-view');
        const fileTextDisplay = document.getElementById('file-text');
        const readingPathDisplay = document.getElementById('reading-path');

        // 3. FONCTIONS D'AFFICHAGE
        function renderDirectory() {
            let pathString = pathStack.map(p => p.name).join("");
            if (pathString.length > 1 && pathString.startsWith("//")) {
                pathString = pathString.substring(1);
            }
            currentPathDisplay.innerHTML = `root@robco:~$ ${pathString}<span class="cursor"></span>`;

            const currentDir = pathStack[pathStack.length - 1].dir;
            directoryList.innerHTML = '';
            currentOptions = [];

            if (pathStack.length > 1) {
                currentOptions.push({ name: "..", type: "up" });
            }

            for (const [key, value] of Object.entries(currentDir)) {
                currentOptions.push({ name: key, type: value.type, content: value.content });
            }
            currentOptions.forEach((opt, index) => {
                const div = document.createElement('div');
                div.classList.add('dir-option');

                // On affiche uniquement le nom, sans les préfixes [DIR] ou [UP]
                div.innerText = opt.name;
                directoryList.appendChild(div);
            });

            selectedIndex = 0;
            updateSelection();
        }

        function updateSelection() {
            if (inViewMode) return;
            const options = document.querySelectorAll('.dir-option');
            options.forEach((opt, index) => {
                if (index === selectedIndex) {
                    opt.classList.add('active');
                } else {
                    opt.classList.remove('active');
                }
            });
        }

        function openFile(fileName, fileContent) {
            inViewMode = true;
            explorerView.style.display = 'none';
            fileContentView.style.display = 'flex';

            readingPathDisplay.innerText = `Reading: ${fileName}`;
            fileTextDisplay.innerText = "";

            let i = 0;
            const typeWriter = setInterval(() => {
                fileTextDisplay.innerText += fileContent.charAt(i);
                i++;
                if (i >= fileContent.length) clearInterval(typeWriter);
            }, 10);
        }

        function closeFile() {
            inViewMode = false;
            fileContentView.style.display = 'none';
            explorerView.style.display = 'flex';
            fileTextDisplay.innerText = "";
        }

        // 4. ÉCOUTEUR CLAVIER
        document.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "Enter", "Backspace", "Escape"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (inViewMode) {
                if (e.key === 'Backspace' || e.key === 'Escape') {
                    closeFile();
                }
                return;
            }

            if (e.key === 'ArrowDown') {
                selectedIndex = (selectedIndex + 1) % currentOptions.length;
                updateSelection();
            }
            else if (e.key === 'ArrowUp') {
                selectedIndex = (selectedIndex - 1 + currentOptions.length) % currentOptions.length;
                updateSelection();
            }
            else if (e.key === 'Enter') {
                const selected = currentOptions[selectedIndex];
                const options = document.querySelectorAll('.dir-option');
                options[selectedIndex].style.backgroundColor = "white";

                setTimeout(() => {
                    if (selected.type === "dir") {
                        pathStack.push({ name: selected.name + "/", dir: selected.content });
                        renderDirectory();
                    }
                    else if (selected.type === "up") {
                        pathStack.pop();
                        renderDirectory();
                    }
                    else if (selected.type === "file") {
                        openFile(selected.name, selected.content);
                    }
                }, 100);
            }
        });

        // 5. BOUTON D'ALIMENTATION
        const powerBtn = document.getElementById('power-btn');
        powerBtn.addEventListener('click', () => {
            document.dispatchEvent(new CustomEvent('powerButtonPressed', { detail: { state: 'toggled' } }));
        });

        // Lancement
        renderDirectory();
    </script>
</body>

</html>
